<!DOCTYPE html>
<html>
<head>
    <title>IFrame</title>
</head>
<body>

    <!-- Iframe Website -->
    <iframe 
        src="https://www.dinus.ac.id/" 
        width="600" 
        height="250">
    </iframe>

    <br><br>

    <!-- Iframe File Lokal -->
    <iframe 
        src="list.html" 
        width="600" 
        height="250">
    </iframe>

    <br><br>

    <!-- Iframe YouTube -->
    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/TyGkpW_MhaI"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

</body>
</html>
